name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Smoke-test the CLI against a project with uninstalled dependencies
        run: |
          mkdir -p /tmp/smoke
          echo '{"name":"smoke","version":"1.0.0","dependencies":{"react-native-fs":"2.20.0"}}' > /tmp/smoke/package.json
          if node dist/index.js -p /tmp/smoke --strict; then
            echo "::error::--strict passed a project whose dependencies are not installed"
            exit 1
          fi
